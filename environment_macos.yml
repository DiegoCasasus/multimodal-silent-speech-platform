name: tfm_unified

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip
  - tk
  - pip:
      # Core numerical and decoder stack
      - numpy>=2.2,<2.4
      - scipy>=1.14,<1.16
      - pandas>=3.0,<3.2
      - scikit-learn>=1.8,<1.10
      - torch>=2.11,<2.13
      - torchvision>=0.26,<0.28
      - torchaudio>=2.11,<2.13
      - joblib>=1.5,<1.7

      # PsychoPy and experiment runtime
      - psychopy==2026.1.3
      - psychtoolbox>=3.0.19,<3.1
      - wxPython>=4.2.5,<4.3
      - pyglet==1.4.11
      - ffpyplayer>=4.5,<4.6
      - soundfile>=0.13,<0.14
      - pillow>=11.3,<13
      - imageio>=2.37,<3
      - imageio-ffmpeg>=0.6,<0.7
      - moviepy>=2.2,<2.3

      # LSL/XDF acquisition
      - pylsl==1.18.2
      - pyxdf==1.17.4
      - pyserial==3.5

      # GUI and configuration
      - PyQt6>=6.9,<6.12
      - pyyaml>=6.0,<6.1
      - python-dotenv>=1.2,<1.3
      - psutil>=7.1,<8

      # Data, plotting and file support
      - matplotlib>=3.10,<3.12
      - openpyxl>=3.1,<3.2
      - tables>=3.10,<3.12
      - xarray>=2026.1,<2027
      - opencv-python>=4.12,<4.14
      - requests>=2.32,<3
      - tqdm>=4.67,<5
